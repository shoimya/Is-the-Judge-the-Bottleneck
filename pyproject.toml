# Lets every file in the repo `import pipeline`, wherever it is run from (VS Code "Debug file", a terminal,
# Kaggle). Installed by the `-e .` line in requirements.txt; there is nothing else to run.
[project]
name = "judge-bottleneck"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["pipeline"]

# Lets the tests import the scripts in setup/ too.
[tool.pytest.ini_options]
pythonpath = ["."]
