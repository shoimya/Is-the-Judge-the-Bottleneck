# Every setting lives here. Code reads it with pipeline.load_config();
# nothing below should be hard-coded anywhere else.
# `null` = not decided yet; the ticket in the comment fills it in.

# Seeds: sampling the question sets, and the bootstrap.
seeds: [0, 1, 2]

# One model per role. Tier 1 uses the same model for all three (picked in T10);
# Tier 3 changes only `judge`. Names are backend-specific: Ollama tags on the
# Mac (dev), Hugging Face ids under vLLM on Kaggle (reported numbers).
models:
  # qwen3:8b = plain Qwen3-8B, the dev model on the Mac, run with thinking off
  # (llm.py passes think=False). project_set_up.py downloads it into data/ollama/.
  judge: qwen3:8b   # T10: Qwen3-8B-AWQ or Qwen3-4B-Instruct-2507
  rewriter: qwen3:8b
  answerer: qwen3:8b

# The LLM door (T04): pipeline.llm.generate(role, prompt) is the only way
# code talks to a model.
llm:
  backend: ollama   # ollama (Mac, dev only) | vllm (Kaggle, every reported number)
  temperature: 0    # greedy decoding
  max_tokens:       # max output tokens per role (sizes retuned in T06/T10)
    judge: 512
    rewriter: 256
    answerer: 128

retrieval:
  k: 2              # placeholder so T08 can run; T10: try 2, 5, 10

loop:
  rounds: 3         # maximum Rounds per question
  token_budget: null  # T10: max Evidence tokens shown to the Judge and Answerer

# Scoring (pipeline/scoring.py). Exact match, precision, recall and F1 need no model; the cosine similarity
# compares the meaning of the answer and the gold answer through an embedding model. The embedder sits here, not
# under `models`, because the Kaggle notebooks test every `models` entry with a chat call, which an embedder can't take.
scoring:
  embedder: qwen3-embedding:0.6b   # Ollama embedding model; project_set_up.py downloads it into data/ollama/
  cosine_threshold: 0.90           # placeholder: cosine >= this counts as "Correct (cosine)"; change it any time

paths:
  data_dir: data
  runs_dir: runs
  results_dir: results
