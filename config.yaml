# The choices an experiment can change. Read with pipeline.config.load_config().
# Fixed facts (download links, folder names, decoding rules) live as named constants
# at the top of the file that uses them.

# Which program runs the model: ollama on the Mac (development only), vllm on Kaggle (every reported number).
backend: ollama

# The model every role uses (its Hugging Face name; llm.py knows its Ollama name).
model: Qwen/Qwen3-4B-Instruct-2507

# Tier 3 only: a different model for the Judge. null = the Judge uses `model` too.
judge_model: null

# The loop. paragraphs_per_round is a development value until T10 picks 2, 5 or 10;
# token_budget stays null (no limit) until T10.
paragraphs_per_round: 5
rounds: 3
token_budget: null

# Longest reply each role may write, in tokens.
max_tokens: {judge: 256, rewriter: 32, answerer: 32}

# Question sets (T02): sampled once from HotpotQA dev with sample_seed.
pilot_size: 100
test_size: 1000
sample_seed: 0

# Seeds for the bootstrap and other repeated randomness in the analysis.
seeds: [0, 1, 2]
