# Every setting lives here. Code reads it with pipeline.load_config();
# nothing below should be hard-coded anywhere else.
# `null` = not decided yet; the ticket in the comment fills it in.

# Seeds for the bootstrap and other repeated randomness (question sampling uses hotpotqa.sample_seed).
seeds: [0, 1, 2]

# Question sets (T02): sampled once from HotpotQA dev, fullwiki setting.
# Downloaded from Hugging Face because the official CMU server is down.
hotpotqa:
  hf_repo: hotpotqa/hotpot_qa
  hf_file: fullwiki/validation-00000-of-00001.parquet
  pilot_size: 100
  test_size: 1000
  sample_seed: 0

# Wikipedia corpus and BM25 index (T03). Built once on Kaggle, then copied to the Mac.
# Folders are relative to paths.data_dir.
wiki:
  dump_url: https://nlp.stanford.edu/projects/hotpotqa/enwiki-20171001-pages-meta-current-withlinks-abstracts.tar.bz2
  dump_dir: wiki/dump
  index_dir: wiki/bm25_index
  recall_ks: [2, 5, 10, 20]   # k values for the Pilot set sanity check

# One model per role. Tier 1 uses the same model for all three (picked in T10);
# Tier 3 changes only `judge`.
models:
  judge: null       # T10: Qwen3-8B-AWQ or Qwen3-4B-Instruct-2507
  rewriter: null    # T10
  answerer: null    # T10

retrieval:
  k: null           # T10: paragraphs retrieved per Round (try 2, 5, 10)

loop:
  rounds: 3         # maximum Rounds per question
  token_budget: null  # T10: max Evidence tokens shown to the Judge and Answerer

paths:
  data_dir: data
  runs_dir: runs
  results_dir: results
